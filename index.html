<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1a3a">
  <title>Adams and Tannaz julkalender</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&family=Yeseva+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-snowflake" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9.2 3.6L12 6l2.8-2.4M9.2 20.4L12 18l2.8 2.4M17.9 5.4L17.2 9l3.5 1.2M20.7 13.8L17.2 15l.7 3.6M6.1 18.6L6.8 15l-3.5-1.2M3.3 10.2L6.8 9l-.7-3.6"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="M12 2l2.47 6.6 7.04.31-5.52 4.39 1.89 6.79L12 16.2l-5.88 3.89 1.89-6.79-5.52-4.39 7.04-.31z"/>
    </symbol>
    <symbol id="icon-tree" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 1.5l4.6 6.2h-2.4l4.3 5.6h-2.6l4.6 5.9H3.5l4.6-5.9H5.5l4.3-5.6H7.4z"/>
      <rect x="10.5" y="19.2" width="3" height="3.3" rx=".6" fill="currentColor"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.5c.8 0 1.4.6 1.4 1.4v.7c2.7.7 4.6 3.1 4.6 5.9v3.8l1.9 2.6c.4.6 0 1.3-.7 1.3H4.8c-.7 0-1.1-.7-.7-1.3L6 14.3v-3.8c0-2.8 1.9-5.2 4.6-5.9v-.7c0-.8.6-1.4 1.4-1.4zM9.5 19.4h5a2.5 2.5 0 0 1-5 0z"/>
    </symbol>
    <symbol id="icon-gift" viewBox="0 0 24 24">
      <path fill="currentColor" d="M3 8.5h8v4H3zM13 8.5h8v4h-8zM4.5 13.5H11V21H4.5zM13 13.5h6.5V21H13zM12 8.2c-1.2-2.6-4.9-4.6-5.9-2.6-.9 1.8 2.6 2.6 5.9 2.6zm0 0c1.2-2.6 4.9-4.6 5.9-2.6.9 1.8-2.6 2.6-5.9 2.6z"/>
    </symbol>
    <symbol id="icon-ornament" viewBox="0 0 24 24">
      <circle cx="12" cy="3" r="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <rect x="9.5" y="4.5" width="5" height="3" rx=".8" fill="currentColor"/>
      <circle cx="12" cy="14.5" r="7.5" fill="currentColor"/>
      <path fill="none" stroke="#000" stroke-opacity=".28" stroke-width="1.3" d="M4.9 12.3c2.4 1.5 4.7 1.5 7.1 0s4.7-1.5 7.1 0M4.6 16.2c2.5 1.5 4.9 1.5 7.4 0s4.9-1.5 7.4 0"/>
    </symbol>
    <symbol id="icon-candy" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" d="M9.5 21V8.5a3.75 3.75 0 0 1 7.5 0V10"/>
      <path fill="none" stroke="#000" stroke-opacity=".28" stroke-width="3.4" stroke-dasharray="1.8 2.4" d="M9.5 21V8.5a3.75 3.75 0 0 1 7.5 0V10"/>
    </symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.6 3.3 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/>
    </symbol>
    <symbol id="icon-candle" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.2c1.6 1.8 2.4 3.2 2.4 4.4a2.4 2.4 0 0 1-4.8 0c0-1.2.8-2.6 2.4-4.4z"/>
      <rect x="11.4" y="8.6" width="1.2" height="2" fill="currentColor"/>
      <rect x="8.5" y="10.4" width="7" height="10.6" rx="1.2" fill="currentColor"/>
      <rect x="6" y="20.2" width="12" height="1.8" rx=".9" fill="currentColor"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" d="M7 10V7.5a5 5 0 0 1 10 0V10h.5A1.5 1.5 0 0 1 19 11.5v8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-8A1.5 1.5 0 0 1 6.5 10zm2.2 0h5.6V7.5a2.8 2.8 0 0 0-5.6 0z"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
    </symbol>
  </svg>

  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <svg class="landscape" viewBox="0 0 1440 340" preserveAspectRatio="xMidYMax slice" focusable="false">
      <defs>
        <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a6699"/>
          <stop offset="1" stop-color="#2c4475"/>
        </linearGradient>
        <linearGradient id="hill-mid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9db4da"/>
          <stop offset="1" stop-color="#6f8bbd"/>
        </linearGradient>
        <linearGradient id="hill-near" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eef4fc"/>
          <stop offset="1" stop-color="#c3d2ea"/>
        </linearGradient>
        <radialGradient id="window-glow">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/>
          <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
        </radialGradient>
        <symbol id="pine" viewBox="0 0 60 100">
          <rect x="26" y="84" width="8" height="16" fill="#24170f"/>
          <path fill="currentColor" d="M30 0L44 24H37L50 48H41L56 72H45L60 88H0L15 72H4L19 48H10L23 24H16Z"/>
          <path fill="none" stroke="#e3ecf8" stroke-width="2.2" stroke-linecap="round" opacity=".75" d="M30 1L44 24M37 24L50 48M41 48L56 72M45 72L60 88"/>
          <path fill="none" stroke="#e3ecf8" stroke-width="1.6" stroke-linecap="round" opacity=".35" d="M30 1L16 24M23 24L10 48M19 48L4 72M15 72L0 88"/>
          <path fill="#f1f6fd" d="M30 0L36.4 11 33 10 30 12.6 27 10 23.6 11Z"/>
        </symbol>
      </defs>

      <path fill="url(#hill-far)" d="M0 190C160 150 320 165 480 150S800 120 980 150S1300 140 1440 160V340H0Z"/>
      <g color="#1d3a63">
        <use href="#pine" x="70" y="140" width="30" height="50"/>
        <use href="#pine" x="105" y="134" width="28" height="46"/>
        <use href="#pine" x="560" y="102" width="30" height="50"/>
        <use href="#pine" x="598" y="96" width="32" height="54"/>
        <use href="#pine" x="640" y="104" width="24" height="40"/>
        <use href="#pine" x="1180" y="116" width="30" height="50"/>
        <use href="#pine" x="1215" y="122" width="25" height="42"/>
        <use href="#pine" x="1360" y="110" width="30" height="50"/>
      </g>

      <path fill="url(#hill-mid)" d="M0 245C180 205 360 230 560 215S900 185 1120 210S1340 200 1440 215V340H0Z"/>
      <g transform="translate(880 150)">
        <circle cx="16" cy="34" r="34" fill="url(#window-glow)"/>
        <rect x="38" y="2" width="8" height="16" fill="#2b1a10"/>
        <rect x="37" y="0" width="10" height="3" rx="1.5" fill="#f1f6fd"/>
        <rect x="0" y="18" width="58" height="34" fill="#4a2c1a"/>
        <path fill="#2b1a10" d="M-7 21L29-4 65 21Z"/>
        <path fill="#f1f6fd" d="M-9 22L29-6 67 22 62 24 29 0-4 24Z"/>
        <rect x="9" y="28" width="14" height="12" rx="1" fill="#ffd27a"/>
        <path fill="none" stroke="#4a2c1a" stroke-width="1.5" d="M16 28v12M9 34h14"/>
        <rect x="34" y="30" width="13" height="22" rx="1" fill="#2b1a10"/>
        <circle cx="44" cy="41" r="1.2" fill="#f0c25d"/>
      </g>
      <g color="#12304a">
        <use href="#pine" x="20" y="165" width="48" height="80"/>
        <use href="#pine" x="70" y="175" width="37" height="62"/>
        <use href="#pine" x="380" y="150" width="43" height="72"/>
        <use href="#pine" x="720" y="130" width="47" height="78"/>
        <use href="#pine" x="770" y="142" width="38" height="64"/>
        <use href="#pine" x="1250" y="142" width="48" height="80"/>
        <use href="#pine" x="1300" y="152" width="40" height="66"/>
      </g>

      <path fill="url(#hill-near)" d="M0 295C240 265 480 300 760 282S1200 262 1440 285V340H0Z"/>
      <g color="#0b2533">
        <use href="#pine" x="-30" y="140" width="96" height="160"/>
        <use href="#pine" x="50" y="180" width="70" height="115"/>
        <use href="#pine" x="470" y="205" width="54" height="90"/>
        <use href="#pine" x="980" y="178" width="60" height="100"/>
        <use href="#pine" x="1290" y="130" width="90" height="150"/>
        <use href="#pine" x="1370" y="168" width="72" height="120"/>
      </g>
    </svg>
  </div>

  <ul class="lights" aria-hidden="true"></ul>
  <canvas class="snow" aria-hidden="true"></canvas>

  <div class="preview-banner" id="preview-banner" hidden>
    <span id="preview-text"></span>
    <button type="button" id="preview-reset">Återställ öppnade luckor</button>
  </div>

  <div class="page">
    <header class="hero">
      <p class="hero__eyebrow"><span aria-hidden="true">✦</span> <span id="hero-year">december</span> <span aria-hidden="true">✦</span></p>
      <h1 class="hero__title" id="hero-title">Adams and Tannaz julkalender</h1>
      <p class="countdown">
        <svg class="countdown__icon" aria-hidden="true"><use href="#icon-bell"></use></svg>
        <span class="countdown__label" id="countdown-label">&nbsp;</span>
        <span class="countdown__time" id="countdown-time"></span>
      </p>
    </header>

    <main class="board">
      <div class="calendar" id="calendar" role="group" aria-label="Kalenderns luckor"></div>
    </main>

    <footer class="footer">
      <div class="progress">
        <span class="progress__bar" aria-hidden="true"><span class="progress__fill" id="progress-fill"></span></span>
        <span id="progress-text">0 av 24 luckor öppnade</span>
      </div>
      <p class="footer__hint">En ny lucka låses upp varje dag vid midnatt. Klicka eller tryck på en lucka för att öppna den.</p>
    </footer>
  </div>

  <div class="modal" id="photo-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__spinner" aria-hidden="true"></div>
    <div class="polaroid-frame" role="dialog" aria-modal="true" aria-labelledby="photo-title">
      <figure class="polaroid">
        <button type="button" class="polaroid__close" data-close aria-label="Stäng bilden">
          <svg aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
        <div class="polaroid__photo">
          <img class="polaroid__img" alt="">
          <div class="polaroid__missing">
            <svg aria-hidden="true"><use href="#icon-gift"></use></svg>
            <p>Det finns ingen bild för den här dagen än.<br>Lägg till en som <code class="polaroid__missing-path"></code></p>
          </div>
        </div>
        <figcaption class="polaroid__caption">
          <h2 class="polaroid__title" id="photo-title"></h2>
          <p class="polaroid__text"></p>
        </figcaption>
      </figure>
    </div>
  </div>

  <div class="fx" aria-hidden="true"></div>

  <div class="toast" role="status" aria-live="polite">
    <svg class="toast__icon" aria-hidden="true"><use href="#icon-lock"></use></svg>
    <span class="toast__text"></span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
